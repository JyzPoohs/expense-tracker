spring:
  application:
    name: expense-tracker

  profiles:
    active: local

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:1880}/realms/${KEYCLOAK_REALM:expense-realm}

  keycloak:
    server-url: ${KEYCLOAK_URL:http://localhost:1880}
    realm: ${KEYCLOAK_REALM:expense-realm}

  docker:
    compose:
      enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      
  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false
      cache-names: dashboard:summary,dashboard:bar-chart,dashboard:pie-chart

server:
  port: ${SERVER_PORT:1331}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}