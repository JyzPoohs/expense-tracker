spring:
  application:
    name: expense-tracker

  profiles:
    active: local

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/expense-realm

  keycloak:
    server-url: http://localhost:8180
    realm: expense-realm

  docker:
    compose:
      enabled: false

server:
  port: 1331