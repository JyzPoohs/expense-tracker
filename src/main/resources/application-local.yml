spring:
  datasource:
    url: jdbc:mysql://localhost:3307/expense_app_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

server:
  port: 8081

keycloak:
  server-url: http://localhost:8080
  realm: expense-realm
  admin-client-id: ${KEYCLOAK_CLIENT_ID}
  admin-client-secret: ${KEYCLOAK_CLIENT_SECRET}

jwt:
  auth:
    converter:
      resource-id: expense-client
      principle-attribute: preferred_username

logging:
  level:
    org.hibernate.SQL: debug