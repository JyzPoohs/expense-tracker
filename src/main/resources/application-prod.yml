spring:
  datasource:
    url: jdbc:mysql://localhost:3306/expense_app_db?createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true

  docker:
    compose:
      enabled: false

logging:
  level:
    org.hibernate.SQL: debug