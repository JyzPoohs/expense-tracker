spring:
  datasource:
    url: jdbc:mysql://localhost:3306/expense_app_db?createDatabaseIfNotExist=true
    username: root
    password: password

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/expense-realm

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true

  docker:
    compose:
      enabled: false

logging:
  level:
    org.hibernate.SQL: debug